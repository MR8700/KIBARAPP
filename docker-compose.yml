services:
  db:    { image: postgres:16, environment: { POSTGRES_USER: kibar, POSTGRES_PASSWORD: kibar_dev, POSTGRES_DB: kibar }, ports: ["5432:5432"], volumes: [pgdata:/var/lib/postgresql/data] }
  redis: { image: redis:7, ports: ["6379:6379"] }
  minio: { image: minio/minio, command: server /data --console-address ":9001", environment: { MINIO_ROOT_USER: kibar, MINIO_ROOT_PASSWORD: kibar_dev_secret }, ports: ["9000:9000","9001:9001"], volumes: [miniodata:/data] }
  clamav: { image: clamav/clamav:1.4, ports: ["3310:3310"], volumes: [clamdb:/var/lib/clamav] }
  # Sauvegarde quotidienne du stockage vers ./backups/storage (profil « backup » : docker compose --profile backup up -d).
  # ATTENTION : même machine = protège des erreurs, pas d'une perte du serveur → copiez ./backups HORS serveur (scripts/backup.sh, BACKUP_REMOTE).
  storage-backup:
    image: minio/mc
    profiles: [backup]
    depends_on: [minio]
    volumes: ["./backups/storage:/backup"]
    entrypoint: ["/bin/sh","-c","mc alias set src http://minio:9000 kibar kibar_dev_secret && while true; do mc mirror --overwrite --remove src/kibar-private /backup/latest; sleep 86400; done"]
volumes: { clamdb: {}, pgdata: {}, miniodata: {} }
