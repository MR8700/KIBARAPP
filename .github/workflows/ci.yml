name: CI - Integration & Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kibar
          POSTGRES_PASSWORD: kibar_test_password
          POSTGRES_DB: kibar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      # Note: ClamAV et MinIO sont testés avec résilience/fallback local dans les tests unitaires

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Security Dependency Audit
        run: npm audit --omit=dev --audit-level=high || true

      - name: Prisma Client Generation & Schema Check
        run: |
          npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Execute Prisma Migration against Test DB
        env:
          DATABASE_URL: postgresql://kibar:kibar_test_password@localhost:5432/kibar_test
        run: |
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run API Unit Tests
        env:
          NODE_ENV: test
          JWT_SECRET: un-secret-de-test-tres-long-et-securise-de-32-octets
        run: npm -w apps/api test

      - name: Build API
        run: npm -w apps/api run build

      - name: Build Web Application
        env:
          NEXT_PUBLIC_API_URL: https://api.kibar.app
          NEXT_IGNORE_INCORRECT_LOCKFILE: '1'
        run: npm -w apps/web run build
