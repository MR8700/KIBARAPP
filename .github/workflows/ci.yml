name: CI - Integration & Tests

on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Test, Audit & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kibar
          POSTGRES_PASSWORD: kibar_test_password
          POSTGRES_DB: kibar_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      minio:
        image: quay.io/minio/minio:latest
        env:
          MINIO_ROOT_USER: kibar_minio_user
          MINIO_ROOT_PASSWORD: kibar_minio_password_123
        ports:
          - 9000:9000
        options: >-
          server /data

      clamav:
        image: clamav/clamav:1.4
        ports:
          - 3310:3310

    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Security Dependency Audit
        run: npm audit --omit=dev --audit-level=high

      - name: Prisma Client Generation & Schema Check
        run: |
          npx prisma generate --schema=apps/api/prisma/schema.prisma

      - name: Execute Prisma Migration against Test DB
        env:
          DATABASE_URL: postgresql://kibar:kibar_test_password@localhost:5432/kibar_test
        run: |
          npx prisma migrate deploy --schema=apps/api/prisma/schema.prisma

      - name: Run API Unit Tests
        env:
          NODE_ENV: test
          JWT_SECRET: un-secret-de-test-tres-long-et-securise-de-32-octets
        run: npm -w apps/api test

      - name: Build API
        run: npm -w apps/api run build

      - name: Build Web Application
        env:
          NEXT_PUBLIC_API_URL: https://api.kibar.app
        run: npm -w apps/web run build
