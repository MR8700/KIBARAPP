<div class="flex flex-col items-center justify-center text-center my-auto px-space-sm"><div class="w-28 h-28 mx-auto mb-6 relative group flex items-center justify-center p-1" style="border-width: 1px 1px 4px; border-style: solid; border-color: rgba(255, 255, 255, 0.8) rgba(255, 255, 255, 0.8) rgb(203, 213, 225); border-image: none; box-shadow: rgba(15, 23, 42, 0.12) 0px 12px 24px -4px, rgba(255, 255, 255, 0.9) 0px 1px 0px inset; border-radius: 1.75rem; background: rgb(255, 255, 255);"><img src="https://lh3.googleusercontent.com/aida/AEtjO1UOwXbSp96ZaPd6H5c7tYOiA1mXo5cmcx53HkKte9ZT-wq8ulc2LqZAzkGd1daaBgg05Af-7kiVb21_fodfyfvA70-V1JLKACMEX9v-f0OuYSma0PQ1oEhP1jXuGOrFmaqDD1ezbCLXz7jscYKmdJVoQ5Rmb2F1VmiUT4n9vhZZYvjxD--4sxlxD79gY3K4y9S1_Dsd7HMiP2m7p5f_TKvvEnOhwX0izUZYRJIjwC2M" alt="KIBAR APP" class="w-28 h-28 object-contain rounded-2xl"></div><h1 class="text-2xl font-bold text-slate-900 tracking-tight">KIBAR <span class="text-blue-700">APP</span></h1><p class="text-xs text-slate-500 mt-1">L'information qui ouvre des opportunités</p><div class="flex flex-wrap items-center justify-center gap-space-xs mt-space-md"><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-high/80 text-on-secondary-container font-label-sm text-label-sm" style="border-width: 1px 1px 2px; border-style: solid; border-color: rgb(203, 213, 225) rgb(203, 213, 225) rgb(148, 163, 184); border-image: none; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 3px;"><span class="material-symbols-outlined text-[13px] text-tertiary">verified</span>Opportunités vérifiées</span><span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-surface-container-high/80 text-on-secondary-container font-label-sm text-label-sm" style="border-width: 1px 1px 2px; border-style: solid; border-color: rgb(203, 213, 225) rgb(203, 213, 225) rgb(148, 163, 184); border-image: none; box-shadow: rgba(0, 0, 0, 0.05) 0px 1px 3px;"><span class="material-symbols-outlined text-[13px] text-primary-container">bolt</span>Accès direct</span></div></div>

<div class="w-full flex flex-col items-center gap-space-sm pb-space-sm">

<div class="w-full max-w-xs flex items-center justify-between px-space-md py-3 rounded-xl bg-surface-container-lowest shadow-sm backdrop-blur-sm" style="border-width: 1px 1px 2px; border-style: solid; border-color: rgb(203, 213, 225) rgb(203, 213, 225) rgb(148, 163, 184); border-image: none; box-shadow: rgba(15, 23, 42, 0.08) 0px 4px 8px -2px, rgba(255, 255, 255, 0.9) 0px 1px 0px inset; border-radius: 0.75rem;">
<div class="flex items-center gap-3">
<!-- Animated Spinner -->
<div class="relative w-4 h-4 flex items-center justify-center">
<div class="absolute inset-0 rounded-full border-2 border-surface-container-high"></div>
<div class="absolute inset-0 rounded-full border-2 border-primary-container border-t-transparent animate-spin"></div>
</div>
<span class="font-label-md text-label-md text-on-surface truncate" id="init-status-text">Chargement des opportunités...</span>
</div>
<span class="font-label-sm text-label-sm text-primary-container font-semibold" id="init-percentage">100%</span>
</div>
<!-- Progress Track -->
<div class="w-full max-w-xs h-1 rounded-full bg-surface-container-high overflow-hidden">
<div class="h-full bg-primary-container rounded-full transition-all duration-300 ease-out" id="progress-bar-inner" style="width: 100%;"></div>
</div>
<!-- Version & Local Trust Badge -->
<div class="flex items-center justify-center gap-2 text-outline font-label-sm text-label-sm pt-space-xs"><span class="">KIBAR APP v2.4</span><span class="inline-block w-1 h-1 rounded-full bg-outline-variant"></span><span class="flex items-center gap-1"><span class="material-symbols-outlined text-xs">hub</span>Réseau d'opportunités</span></div>
</div>
</div>
</div>
<script>
  (function() {
    const statusText = document.getElementById('init-status-text');
    const percentage = document.getElementById('init-percentage');
    const progressBar = document.getElementById('progress-bar-inner');
    
    if (!statusText || !percentage || !progressBar) return;

    const milestones = [
      { pct: 82, label: 'Chargement des formulaires express...' },
      { pct: 94, label: 'Vérification du profil recruteur...' },
      { pct: 100, label: 'Session prête !' }
    ];

    let currentStep = 0;

    const interval = setInterval(() => {
      if (currentStep < milestones.length) {
        const item = milestones[currentStep];
        percentage.textContent = item.pct + '%';
        progressBar.style.width = item.pct + '%';
        statusText.textContent = item.label;
        currentStep++;
      } else {
        clearInterval(interval);
      }
    }, 850);
  })();
</script></main>
